<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KS-ONE</title>
<meta name="description" content="KS-ONE · ระบบใบสั่ง KOSIN">
<meta name="theme-color" content="#0B1F4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KS-ONE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #0B1F4D; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #app { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - env(safe-area-inset-top)); border: 0; background: #F2F5F8; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          color: #fff; font-family: 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif; font-size: 16px; background: #0B1F4D; transition: opacity .3s; }
  #load img { width: 96px; height: 96px; border-radius: 22px; animation: bl 1.2s infinite; }
  #load a { color: #D4AF37; font-size: 14px; }
  @keyframes bl { 50% { opacity: .55; } }
</style>
</head>
<body>
<iframe id="app" title="KS-ONE" allow="camera; clipboard-write" src="about:blank"></iframe>
<div id="load"><img src="icon-192.png" alt=""><div>กำลังเปิด KS-ONE…</div>
  <a id="direct" href="https://script.google.com/macros/s/AKfycbwCwW-_G50IztCQuFWxIQpjlXtUYN1cPLDoKmsbkIG5FKfxrdTFBDW2bZoKw2DJj9bk/exec?menu=1">เปิดไม่ขึ้น? กดที่นี่</a></div>
<script>
  /* กรอบแอป KS-ONE: หน้าข้างในเป็น Apps Script (KS-ONE / ใบส้ม / Dashboard) · ทุกหน้าเปิดด้วย &app=1
     หน้าข้างในเปลี่ยนหน้าโดยส่ง postMessage {ksone:'nav',url} มาให้กรอบนี้เปลี่ยน src ให้ → ไม่หลุดออกจากแอป */
  var KS = 'https://script.google.com/macros/s/AKfycbwCwW-_G50IztCQuFWxIQpjlXtUYN1cPLDoKmsbkIG5FKfxrdTFBDW2bZoKw2DJj9bk/exec';
  var f = document.getElementById('app'), l = document.getElementById('load');
  function withApp(u) { return /[?&]app=1/.test(u) ? u : u + (u.indexOf('?') >= 0 ? '&' : '?') + 'app=1'; }
  function go(u) {
    if (!/^https:\/\/script\.google\.com\//.test(u)) return;
    l.style.display = ''; l.style.opacity = '1';
    f.src = withApp(u);
  }
  f.addEventListener('load', function () { l.style.opacity = '0'; setTimeout(function () { l.style.display = 'none'; }, 300); });
  window.addEventListener('message', function (ev) {
    var d = ev.data; if (d && d.ksone === 'nav' && typeof d.url === 'string') go(d.url);
  });
  /* เปิดลิงก์เจาะจงได้: index.html?u=<url KS-ONE> (เช่นจากอีเมล) · ไม่มีก็ไปเมนูหลัก */
  var q = new URLSearchParams(location.search).get('u');
  go(q && /^https:\/\/script\.google\.com\//.test(q) ? q : KS + '?menu=1');
</script>
</body>
</html>
